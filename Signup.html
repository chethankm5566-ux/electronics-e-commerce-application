<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./signup.css">
</head>
<body>
    <form action="">
        <fieldset>
            <legend><h3>Signup Page</h3> </legend>
            <label for="un">UserName</label> 
            <input type="text" name="name" id="un" required  placeholder="Enter UserName" >
            <!-- <br> -->
            <label for="pwd">Password</label>
            <input type="password" name="password" id="pwd" required placeholder="Enter password">
            <!-- <br> -->
            <label for="em">Email</label>
            <input type="email" name="email" id="em" required placeholder="Enter Email">
            <!-- <br> -->
            <label for="phone"> Ph Number </label>
            <input type="tel" name="phone" id="phone" minlength="10" maxlength="10" required placeholder="Enter ph.number">
            <!-- <br> -->
            <label for="age">Age</label>
            <input type="number" name="age" id="age" min="20" max="25" placeholder="Enter Age">
            <!-- <br> -->
            <label for="dob">Date Of Birth</label>
            <input type="datetime-local" name="dob" id="dob">
            <!-- <br> -->
            <label for="imageUrl">Image url</label>
            <input type="url" name="imageUrl" value="imageUrl">
            <!-- <br> -->
             <button>Submit</button>
             <button>Reset</button>
        </fieldset>
    </form>
    
</body>
<script src="./Signup.js">

</script>
</html>
